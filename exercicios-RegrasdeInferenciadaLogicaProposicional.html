<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lógica Proposicional · Verificador de Regras de Inferência</title>
    <link rel="icon" type="image/svg+xml" href="Style/favicon.svg">
    <link rel="stylesheet" href="Style/style.css">
    <link rel="stylesheet" href="Style/sidbar.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0b0c10;
            --surface: #13161f;
            --card: #1a1e2a;
            --border: #2c3142;
            --accent: #6c5ce7;
            --accent2: #a855f7;
            --accent3: #38bdf8;
            --text: #eef2ff;
            --muted: #8b92b0;
            --correct: #10b981;
            --warning: #f59e0b;
            --wrong: #ef4444;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding: 20px;
            font-size: 16px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sub {
            color: var(--muted);
            margin-bottom: 20px;
            border-left: 3px solid var(--accent);
            padding-left: 16px;
        }

        .toolbar {
            background: var(--surface);
            padding: 12px 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-weight: 600;
        }
        .stats span {
            background: var(--card);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .btn-primary {
            background: linear-gradient(95deg, var(--accent), var(--accent2));
            border: none;
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-outline { border-color: var(--accent); color: var(--accent); }
        .btn-outline:hover { background: rgba(108,92,231,0.1); }
        .btn-danger { border-color: var(--wrong); color: var(--wrong); }
        .btn-danger:hover { background: rgba(239,68,68,0.1); }

        .quest-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
            background: var(--surface);
            padding: 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            max-height: 120px;
            overflow-y: auto;
        }
        .nav-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Fira Code', monospace;
        }
        .nav-btn:hover { border-color: var(--accent); }
        .nav-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .nav-btn.correct { background: var(--correct); border-color: var(--correct); color: #fff; }
        .nav-btn.wrong { background: var(--wrong); border-color: var(--wrong); color: #fff; }
        .nav-btn.has-answer { border-color: var(--accent2); background: rgba(168,85,247,0.2); }

        .quest-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 28px;
            margin-bottom: 20px;
        }
        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .quest-number {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent);
        }
        .status-badge {
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-correct { background: rgba(16,185,129,0.2); color: var(--correct); }
        .status-wrong { background: rgba(239,68,68,0.2); color: var(--wrong); }
        .expression-box {
            background: #0a0c14;
            padding: 18px 22px;
            border-radius: 20px;
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            margin-bottom: 24px;
            border-left: 6px solid var(--accent);
            word-break: break-word;
        }
        .editor-wrapper {
            background: #1E1E1E;
            border: 1px solid #3C3C3C;
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.2s;
        }
        .editor-header {
            background: #2D2D2D;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3C3C3C;
            font-size: 0.8rem;
        }
        .btn-expand {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-expand:hover { background: #3C3C3C; }
        .answer-textarea {
            width: 100%;
            background: #1E1E1E;
            border: none;
            color: #D4D4D4;
            font-family: 'Fira Code', monospace;
            font-size: 15px;
            line-height: 1.7;
            padding: 20px;
            resize: vertical;
            outline: none;
        }
        .answer-textarea:focus { outline: none; }
        .editor-wrapper.expanded {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            bottom: 20px;
            z-index: 10000;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .editor-wrapper.expanded .answer-textarea {
            height: calc(100% - 50px);
            font-size: 18px;
            line-height: 1.8;
        }
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 9999;
            backdrop-filter: blur(4px);
        }
        .overlay.show { display: block; }
        .action-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .result-box {
            margin-top: 18px;
            padding: 16px;
            border-radius: 16px;
            display: none;
            font-size: 14px;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
        }
        .result-box.show { display: block; }
        .result-box.success { background: rgba(16,185,129,0.1); border: 2px solid rgba(16,185,129,0.4); color: var(--correct); }
        .result-box.fail { background: rgba(239,68,68,0.1); border: 2px solid rgba(239,68,68,0.4); color: #ff8a8a; }
        .hint-box {
            background: rgba(245,158,11,0.08);
            border: 1px solid rgba(245,158,11,0.3);
            border-radius: 14px;
            padding: 14px;
            margin-top: 12px;
            font-size: 0.85rem;
            display: none;
        }
        .hint-box.show { display: block; }
        .progress-bar {
            height: 8px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--correct), var(--accent2));
            transition: width 0.4s;
        }
        @media (max-width: 700px) {
            .quest-card { padding: 20px; }
            .expression-box { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="overlay" id="fullscreen-overlay"></div>
<div class="container">
    <h1>📐 Lógica Proposicional · Regras de Inferência</h1>
    <div class="sub">Responda as questões • Mate.js compila e verifica cada passo da demonstração</div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="toolbar">
        <div class="stats">
            <span>📋 Total: <span id="totalQuest">0</span> questões</span>
            <span id="correctCounter">✓ 0 corretas</span>
            <span id="answeredCounter">📝 0 respondidas</span>
        </div>
        <div class="btn-group">
            <button class="btn" id="clearAllBtn">🗑️ Limpar respostas</button>
            <button class="btn btn-primary" id="exportPdfBtn">📄 Exportar PDF</button>
        </div>
    </div>

    <div class="quest-nav" id="questNav"></div>
    <div class="quest-card" id="questCard"></div>
</div>

<script>
// ==============================================================
// Mate.js - COMPILADOR DE DEMONSTRAÇÕES LÓGICAS
// ==============================================================
class LogicCompiler {
    constructor() {
        this.operators = {
            '/\\': '∧', '∧': '∧', 'and': '∧', 'e': '∧',
            '\\/': '∨', '∨': '∨', 'or': '∨', 'ou': '∨',
            '~': '¬', '¬': '¬', 'not': '¬', 'não': '¬', 'nao': '¬',
            '->': '→', '→': '→', '→': '→',
            '<->': '↔', '↔': '↔', '↔': '↔',
            '<-': '←', '←': '←'
        };
        this.premises = new Set();
        this.provenLines = new Map();
    }

    normalizeFormula(formula) {
        let normalized = formula.replace(/\s+/g, ' ').trim();
        for (let [key, value] of Object.entries(this.operators)) {
            const escaped = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            normalized = normalized.replace(new RegExp(escaped, 'gi'), value);
        }
        return normalized;
    }

    tokenize(formula) {
        const regex = /[A-Za-z]+|∧|∨|¬|→|↔|←|\(|\)|⊤|⊥/g;
        return formula.match(regex) || [];
    }

    parseFormula(formula) {
        const normalized = this.normalizeFormula(formula);
        const tokens = this.tokenize(normalized);
        let pos = 0;

        const parseExpression = () => {
            let left = parseTerm();
            while (pos < tokens.length && ['→', '↔', '←', '∧', '∨'].includes(tokens[pos])) {
                const op = tokens[pos++];
                const right = parseTerm();
                left = { type: 'binary', operator: op, left, right };
            }
            return left;
        };

        const parseTerm = () => {
            if (tokens[pos] === '¬') {
                pos++;
                return { type: 'unary', operator: '¬', operand: parseTerm() };
            }
            if (tokens[pos] === '(') {
                pos++;
                const expr = parseExpression();
                if (tokens[pos] === ')') pos++;
                return expr;
            }
            if (tokens[pos] === '⊤') { pos++; return { type: 'constant', value: true }; }
            if (tokens[pos] === '⊥') { pos++; return { type: 'constant', value: false }; }
            const atom = tokens[pos++];
            return { type: 'atom', name: atom };
        };

        return parseExpression();
    }

    formulasEqual(f1, f2) {
        if (!f1 || !f2) return false;
        if (f1.type !== f2.type) return false;
        if (f1.type === 'atom') return f1.name === f2.name;
        if (f1.type === 'constant') return f1.value === f2.value;
        if (f1.type === 'unary') {
            return f1.operator === f2.operator && this.formulasEqual(f1.operand, f2.operand);
        }
        if (f1.type === 'binary') {
            return f1.operator === f2.operator &&
                   this.formulasEqual(f1.left, f2.left) &&
                   this.formulasEqual(f1.right, f2.right);
        }
        return false;
    }

    verifyModusPonens(premises, conclusion) {
        if (premises.length < 2) return { valid: false, error: 'MP requer 2 premissas: P → Q e P' };
        let implication = null, antecedent = null;
        for (const prem of premises) {
            if (prem.type === 'binary' && prem.operator === '→') implication = prem;
            else antecedent = prem;
        }
        if (!implication) return { valid: false, error: 'Nenhuma implicação encontrada nas premissas' };
        if (!this.formulasEqual(implication.left, antecedent))
            return { valid: false, error: 'O antecedente não corresponde à premissa menor' };
        if (!this.formulasEqual(implication.right, conclusion))
            return { valid: false, error: 'A conclusão não corresponde ao consequente' };
        return { valid: true, message: 'Modus Ponens aplicado corretamente' };
    }

    verifyModusTollens(premises, conclusion) {
        if (premises.length < 2) return { valid: false, error: 'MT requer 2 premissas: P → Q e ¬Q' };
        let implication = null, negConsequent = null;
        for (const prem of premises) {
            if (prem.type === 'binary' && prem.operator === '→') implication = prem;
            else if (prem.type === 'unary' && prem.operator === '¬') negConsequent = prem;
        }
        if (!implication || !negConsequent) return { valid: false, error: 'Estrutura incorreta para MT' };
        if (!this.formulasEqual(implication.right, negConsequent.operand))
            return { valid: false, error: '¬Q não corresponde ao consequente da implicação' };
        if (conclusion.type !== 'unary' || conclusion.operator !== '¬' ||
            !this.formulasEqual(conclusion.operand, implication.left))
            return { valid: false, error: 'Conclusão deve ser ¬P' };
        return { valid: true, message: 'Modus Tollens aplicado corretamente' };
    }

    verifyConjunctionElim(premises, conclusion) {
        if (premises.length !== 1) return { valid: false, error: '∧E requer 1 premissa: P ∧ Q' };
        const prem = premises[0];
        if (prem.type !== 'binary' || prem.operator !== '∧')
            return { valid: false, error: 'Premissa não é uma conjunção' };
        if (!this.formulasEqual(prem.left, conclusion) && !this.formulasEqual(prem.right, conclusion))
            return { valid: false, error: 'Conclusão não é parte da conjunção' };
        return { valid: true, message: 'Eliminação da conjunção aplicada corretamente' };
    }

    verifyConjunctionIntro(premises, conclusion) {
        if (premises.length < 2) return { valid: false, error: '∧I requer 2 premissas: P e Q' };
        if (conclusion.type !== 'binary' || conclusion.operator !== '∧')
            return { valid: false, error: 'Conclusão não é uma conjunção' };
        const leftMatch = premises.some(p => this.formulasEqual(p, conclusion.left));
        const rightMatch = premises.some(p => this.formulasEqual(p, conclusion.right));
        if (!leftMatch || !rightMatch)
            return { valid: false, error: 'Premissas não correspondem aos componentes da conjunção' };
        return { valid: true, message: 'Introdução da conjunção aplicada corretamente' };
    }

    verifyDisjunctionIntro(premises, conclusion) {
        if (premises.length !== 1) return { valid: false, error: '∨I requer 1 premissa' };
        if (conclusion.type !== 'binary' || conclusion.operator !== '∨')
            return { valid: false, error: 'Conclusão não é uma disjunção' };
        if (!this.formulasEqual(premises[0], conclusion.left) && !this.formulasEqual(premises[0], conclusion.right))
            return { valid: false, error: 'Premissa não corresponde a nenhum disjunto' };
        return { valid: true, message: 'Introdução da disjunção aplicada corretamente' };
    }

    verifyDisjunctionElim(premises, conclusion) {
        return { valid: false, error: '∨E (Prova por Casos) requer estrutura especial com subprovas' };
    }

    verifyImplicationIntro(premises, conclusion) {
        return { valid: false, error: '→I requer dedução natural com hipóteses. Use formato de subprova.' };
    }

    verifyNegationIntro(premises, conclusion) {
        if (conclusion.type === 'unary' && conclusion.operator === '¬')
            return { valid: true, message: '¬I: Redução ao absurdo aceita (verificação simplificada)' };
        return { valid: false, error: '¬I requer conclusão do tipo ¬P' };
    }

    verifyNegationElim(premises, conclusion) {
        for (const prem of premises) {
            if (prem.type === 'unary' && prem.operator === '¬' &&
                this.formulasEqual(prem.operand, conclusion))
                return { valid: true, message: '¬E: Dupla negação eliminada' };
        }
        return { valid: false, error: '¬E requer premissa ¬¬P para concluir P' };
    }

    verifyBiconditionalIntro(premises, conclusion) {
        return { valid: false, error: '↔I requer duas implicações. Use ↔E para separar.' };
    }

    verifyBiconditionalElim(premises, conclusion) {
        if (premises.length !== 1) return { valid: false, error: '↔E requer 1 premissa: P ↔ Q' };
        const prem = premises[0];
        if (prem.type !== 'binary' || prem.operator !== '↔')
            return { valid: false, error: 'Premissa não é uma bicondicional' };
        if (conclusion.type === 'binary' && conclusion.operator === '→') {
            if ((this.formulasEqual(conclusion.left, prem.left) && this.formulasEqual(conclusion.right, prem.right)) ||
                (this.formulasEqual(conclusion.left, prem.right) && this.formulasEqual(conclusion.right, prem.left)))
                return { valid: true, message: '↔E: Implicação extraída da bicondicional' };
        }
        return { valid: false, error: '↔E deve extrair P → Q ou Q → P' };
    }

    verifyAbsurdity(premises, conclusion) {
        const hasContradiction = premises.some((p, i) => 
            premises.some((q, j) => i !== j && 
                ((p.type === 'unary' && p.operator === '¬' && this.formulasEqual(p.operand, q)) ||
                 (q.type === 'unary' && q.operator === '¬' && this.formulasEqual(q.operand, p)))
            )
        );
        if (hasContradiction) return { valid: true, message: 'Absurdo (⊥): Contradição encontrada' };
        return { valid: false, error: 'Absurdo requer P e ¬P simultaneamente' };
    }

    verifyRule(ruleName, premises, conclusion, lineNumbers) {
        const rule = ruleName.toUpperCase().replace(/\s+/g, '');
        const rules = {
            'MP': () => this.verifyModusPonens(premises, conclusion),
            'MODUSPONENS': () => this.verifyModusPonens(premises, conclusion),
            'MT': () => this.verifyModusTollens(premises, conclusion),
            'MODUSTOLLENS': () => this.verifyModusTollens(premises, conclusion),
            '∧E': () => this.verifyConjunctionElim(premises, conclusion),
            '∧I': () => this.verifyConjunctionIntro(premises, conclusion),
            '∨I': () => this.verifyDisjunctionIntro(premises, conclusion),
            '∨E': () => this.verifyDisjunctionElim(premises, conclusion),
            '→I': () => this.verifyImplicationIntro(premises, conclusion),
            '¬I': () => this.verifyNegationIntro(premises, conclusion),
            '¬E': () => this.verifyNegationElim(premises, conclusion),
            '↔I': () => this.verifyBiconditionalIntro(premises, conclusion),
            '↔E': () => this.verifyBiconditionalElim(premises, conclusion),
            'ABS': () => this.verifyAbsurdity(premises, conclusion),
        };
        if (rules[rule]) return rules[rule]();
        return { valid: false, error: `Regra "${ruleName}" não reconhecida` };
    }

    parseDemonstrationLine(line) {
        const regex = /^(\d+)\.\s+(.+?)\s*(?:\((.+)\))?\s*$/;
        const match = line.match(regex);
        if (!match) return { error: 'Formato inválido. Use: N. FÓRMULA (REGRA LINHAS)' };
        return {
            number: parseInt(match[1]),
            formula: match[2].trim(),
            justification: match[3] ? match[3].trim() : ''
        };
    }

    compileDemonstration(demonstration, premisesList) {
        this.premises = new Set(premisesList.map(p => this.normalizeFormula(p)));
        this.provenLines = new Map();
        const lines = demonstration.split('\n').filter(l => l.trim());
        const results = [];
        let allValid = true;

        for (let i = 0; i < lines.length; i++) {
            const parsed = this.parseDemonstrationLine(lines[i]);
            if (parsed.error) {
                results.push({ line: i + 1, valid: false, error: parsed.error });
                allValid = false;
                continue;
            }

            let justification = parsed.justification.toLowerCase();
            let formula;
            try {
                formula = this.parseFormula(parsed.formula);
            } catch(e) {
                results.push({ line: parsed.number, valid: false, error: 'Fórmula mal formada', formula: parsed.formula });
                allValid = false;
                continue;
            }

            if (justification.includes('prem') || justification.includes('premissa')) {
                if (this.premises.has(this.normalizeFormula(parsed.formula))) {
                    this.provenLines.set(parsed.number, formula);
                    results.push({ line: parsed.number, valid: true, message: 'Premissa aceita', formula: parsed.formula });
                } else {
                    results.push({ line: parsed.number, valid: false, error: `"${parsed.formula}" não está nas premissas`, formula: parsed.formula });
                    allValid = false;
                }
                continue;
            }

            const justParts = justification.split(/[\s,]+/);
            const ruleName = justParts[0];
            const refLines = justParts.slice(1).map(l => parseInt(l)).filter(n => !isNaN(n));

            if (!ruleName) {
                results.push({ line: parsed.number, valid: false, error: 'Justificativa ausente', formula: parsed.formula });
                allValid = false;
                continue;
            }

            const referencedFormulas = refLines.map(n => this.provenLines.get(n)).filter(f => f !== undefined);
            if (referencedFormulas.length !== refLines.length) {
                results.push({ line: parsed.number, valid: false, error: 'Linhas de referência não encontradas', formula: parsed.formula });
                allValid = false;
                continue;
            }

            const verification = this.verifyRule(ruleName, referencedFormulas, formula, refLines);
            if (verification.valid) {
                this.provenLines.set(parsed.number, formula);
            } else {
                allValid = false;
            }

            results.push({
                line: parsed.number,
                valid: verification.valid,
                message: verification.message || verification.error,
                formula: parsed.formula,
                rule: ruleName.toUpperCase(),
                references: refLines
            });
        }

        return {
            valid: allValid,
            steps: results,
            totalSteps: results.length,
            validSteps: results.filter(r => r.valid).length
        };
    }
}

// ==============================================================
// BANCO DE QUESTÕES
// ==============================================================
const QUESTOES = [
    { id: 1, expr: "C, S → A, C → S  |-  A", hint: "Use Modus Ponens duas vezes", minLength: 30 },

// ==============================================================
// STORAGE
// ==============================================================
const STORAGE_KEY = "logica_respostas_final";
let savedAnswers = {};
let verifiedStatus = {};

function loadStorage() {
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) { const p = JSON.parse(data); savedAnswers = p.answers || {}; verifiedStatus = p.status || {}; }
    } catch(e) { savedAnswers = {}; verifiedStatus = {}; }
}

function persistAll() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers: savedAnswers, status: verifiedStatus }));
}

function saveAnswer(id, text) {
    if (text && text.trim()) savedAnswers[id] = text;
    else { delete savedAnswers[id]; delete verifiedStatus[id]; }
    persistAll();
    updateStats();
    renderNavButtons();
}

function updateStats() {
    const total = QUESTOES.length;
    const correct = Object.values(verifiedStatus).filter(v => v === 'correct').length;
    const answered = Object.keys(savedAnswers).filter(id => savedAnswers[id]?.trim()).length;
    document.getElementById("totalQuest").textContent = total;
    document.getElementById("correctCounter").innerHTML = "✓ " + correct + " corretas";
    document.getElementById("answeredCounter").innerHTML = "📝 " + answered + " respondidas";
    document.getElementById("progressFill").style.width = (correct / total) * 100 + "%";
}

let currentQuestIndex = 0;

function renderNavButtons() {
    const nav = document.getElementById("questNav");
    if (!nav) return;
    nav.innerHTML = QUESTOES.map((q, idx) => {
        let cls = "";
        if (idx === currentQuestIndex) cls = "active";
        else if (verifiedStatus[q.id] === 'correct') cls = "correct";
        else if (verifiedStatus[q.id] === 'wrong') cls = "wrong";
        else if (savedAnswers[q.id]?.trim()) cls = "has-answer";
        return `<button class="nav-btn ${cls}" data-idx="${idx}">${q.id}</button>`;
    }).join("");
    document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", (e) => goToQuest(parseInt(btn.dataset.idx)));
    });
}

function goToQuest(index) {
    currentQuestIndex = index;
    renderNavButtons();
    renderCurrentQuest();
}

let expandedWrapper = null;
function toggleExpand(wrapperId) {
    const wrapper = document.getElementById(wrapperId);
    const overlay = document.getElementById("fullscreen-overlay");
    if (!wrapper) return;
    if (wrapper.classList.contains("expanded")) {
        wrapper.classList.remove("expanded");
        overlay.classList.remove("show");
        document.body.style.overflow = "";
    } else {
        if (expandedWrapper) expandedWrapper.classList.remove("expanded");
        wrapper.classList.add("expanded");
        overlay.classList.add("show");
        document.body.style.overflow = "hidden";
        expandedWrapper = wrapper;
    }
}

// ==============================================================
// FUNÇÃO DE VERIFICAÇÃO COM MATE.JS
// ==============================================================
function compilarDemonstracao(questaoId) {
    const compiler = new LogicCompiler();
    const resposta = savedAnswers[questaoId] || '';
    const questao = QUESTOES.find(q => q.id === questaoId);
    
    if (!resposta.trim()) {
        return { error: 'Nenhuma demonstração fornecida' };
    }
    
    const exprParts = questao.expr.split('|-');
    const premisesStr = exprParts[0].trim();
    const premises = premisesStr.split(',').map(p => p.trim());
    
    const result = compiler.compileDemonstration(resposta, premises);
    
    return {
        ...result,
        questao: questao.expr,
        premises,
        conclusion: exprParts[1] ? exprParts[1].trim() : ''
    };
}

function exibirResultadoCompilacao(resultado, questaoId) {
    const resultBox = document.getElementById('result-' + questaoId);
    const q = QUESTOES.find(qq => qq.id === questaoId);
    
    if (resultado.error) {
        resultBox.className = 'result-box fail show';
        resultBox.innerHTML = `<strong>✗ Erro: ${resultado.error}</strong><br><br>💡 Dica: ${q.hint}`;
        return;
    }
    
    let html = '';
    
    if (resultado.valid) {
        html += '<div style="color: #10b981; font-size: 16px;"><strong>✓ Demonstração VÁLIDA!</strong></div>';
    } else {
        html += '<div style="color: #ef4444; font-size: 16px;"><strong>✗ Demonstração INVÁLIDA</strong></div>';
    }
    
    html += `<div style="margin-top: 10px;">📊 Passos: ${resultado.validSteps}/${resultado.totalSteps} válidos</div>`;
    html += '<div style="margin-top: 10px; max-height: 200px; overflow-y: auto;">';
    
    resultado.steps.forEach(step => {
        const color = step.valid ? '#10b981' : '#ef4444';
        const icon = step.valid ? '✓' : '✗';
        html += `<div style="color: ${color}; margin: 8px 0; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05);">${icon} <strong>Linha ${step.line}:</strong> ${step.formula || ''} <span style="font-size: 12px; opacity: 0.8;">— ${step.message}</span></div>`;
    });
    
    html += '</div>';
    
    if (!resultado.valid) {
        html += `<br><div style="margin-top: 12px;">💡 <strong>Dica:</strong> ${q.hint}</div>`;
    }
    
    resultBox.className = 'result-box ' + (resultado.valid ? 'success' : 'fail') + ' show';
    resultBox.innerHTML = html;
}

function verificarQuestao(id) {
    const resultado = compilarDemonstracao(id);
    exibirResultadoCompilacao(resultado, id);
    
    if (!resultado.error) {
        verifiedStatus[id] = resultado.valid ? 'correct' : 'wrong';
    } else {
        verifiedStatus[id] = 'wrong';
    }
    
    persistAll();
    updateStats();
    renderNavButtons();
    renderCurrentQuest();
}

function renderCurrentQuest() {
    const q = QUESTOES[currentQuestIndex];
    const savedVal = savedAnswers[q.id] || "";
    const isCorrect = verifiedStatus[q.id] === 'correct';
    const wrapperId = "editor-" + q.id;
    const statusHtml = isCorrect ? '<div class="status-badge status-correct">✓ Correta</div>' : (verifiedStatus[q.id] === 'wrong' ? '<div class="status-badge status-wrong">✗ Incorreta</div>' : '');
    const cardHtml = `
        <div class="quest-header"><span class="quest-number">Questão ${q.id}</span><div>${statusHtml}</div></div>
        <div class="expression-box">|- ${escapeHtml(q.expr)}</div>
        <div class="answer-expandable"><div class="editor-wrapper" id="${wrapperId}">
            <div class="editor-header"><span>📝 Sua demonstração (Mate.js compilará cada passo)</span><button class="btn-expand" onclick="toggleExpand('${wrapperId}')">⛶ Expandir</button></div>
            <textarea class="answer-textarea" id="answer-${q.id}" rows="10" placeholder="Exemplo:&#10;1. C (Premissa)&#10;2. C → S (Premissa)&#10;3. S (MP 1,2)&#10;4. S → A (Premissa)&#10;5. A (MP 3,4)">${escapeHtml(savedVal)}</textarea>
        </div></div>
        <div class="action-buttons">
            ${!isCorrect ? `<button class="btn btn-primary" id="checkBtn-${q.id}">🔍 Compilar com Mate.js</button><button class="btn btn-outline" id="hintBtn-${q.id}">💡 Dica</button>` : `<span style="background:rgba(16,185,129,0.2);padding:8px 20px;border-radius:40px;">✓ Verificada como correta!</span><button class="btn btn-danger" id="resetQuestBtn-${q.id}">🔄 Revisar</button>`}
        </div>
        <div class="result-box" id="result-${q.id}"></div>
        <div class="hint-box" id="hint-${q.id}">💡 ${q.hint}</div>
    `;
    document.getElementById("questCard").innerHTML = cardHtml;
    const ta = document.getElementById("answer-" + q.id);
    if (ta) ta.addEventListener('input', (e) => { saveAnswer(q.id, e.target.value); if (verifiedStatus[q.id]) { delete verifiedStatus[q.id]; persistAll(); renderCurrentQuest(); } renderNavButtons(); updateStats(); });
    if (!isCorrect) {
        document.getElementById("checkBtn-" + q.id)?.addEventListener("click", () => verificarQuestao(q.id));
        document.getElementById("hintBtn-" + q.id)?.addEventListener("click", () => document.getElementById("hint-" + q.id)?.classList.toggle("show"));
    } else {
        document.getElementById("resetQuestBtn-" + q.id)?.addEventListener("click", () => { delete verifiedStatus[q.id]; persistAll(); updateStats(); renderNavButtons(); renderCurrentQuest(); });
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, (m) => m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;'));
}

function clearAll() {
    if (confirm("Apagar TODAS as respostas e verificações?")) {
        savedAnswers = {}; verifiedStatus = {};
        persistAll(); updateStats(); renderNavButtons(); renderCurrentQuest();
    }
}

async function exportToPDF() {
    const toast = document.createElement("div");
    toast.innerText = "Gerando PDF...";
    toast.style.cssText = "position:fixed;bottom:20px;right:20px;background:#1a1e2a;padding:12px 24px;border-radius:40px;z-index:10001;border:1px solid #6c5ce7;";
    document.body.appendChild(toast);
    try {
        const pdfDoc = document.createElement("div");
        pdfDoc.style.cssText = "font-family: 'Arial', 'Helvetica', sans-serif; background: white; color: black; padding: 30px; max-width: 1100px; margin: 0 auto;";
        pdfDoc.innerHTML = `
            <div style="text-align: center; margin-bottom: 30px; border-bottom: 2px solid black; padding-bottom: 15px;">
                <div style="font-size: 18px; font-weight: bold;">Universidade Federal de Mato Grosso do Sul</div>
                <div style="font-size: 14px;">Campus de Ponta Porã</div>
                <div style="font-size: 13px; margin-top: 5px;">Disciplina: Fundamentos Matemáticos para Computação</div>
                <div style="font-size: 16px; font-weight: bold; margin-top: 15px;">Lista de Exercícios – Regras de Inferência da Lógica Proposicional</div>
            </div>
        `;
        for (let q of QUESTOES) {
            const resp = savedAnswers[q.id]?.trim() || "Nenhuma resposta fornecida";
            const div = document.createElement("div");
            div.style.cssText = "margin-bottom: 25px; border: 1px solid #aaa; padding: 15px; page-break-inside: avoid; background: white;";
            div.innerHTML = `
                <div style="font-weight: bold; font-size: 15px; border-bottom: 1px solid #999; padding-bottom: 5px; margin-bottom: 10px;">${q.id}.</div>
                <div style="font-family: 'Courier New', monospace; background: #f9f9f9; padding: 10px 14px; border-left: 4px solid black; margin: 10px 0; font-size: 13px; font-weight: bold;">|- ${escapeHtml(q.expr)}</div>
                <div style="font-weight: bold; font-size: 13px; margin-top: 12px; margin-bottom: 8px;">RESPOSTA:</div>
                <div style="font-family: 'Courier New', monospace; background: white; border: 1px solid #bbb; padding: 12px; font-size: 13px; font-weight: bold; line-height: 1.6; white-space: pre-wrap; color: #000;">${escapeHtml(resp)}</div>
            `;
            pdfDoc.appendChild(div);
        }
        pdfDoc.innerHTML += `<div style="margin-top: 30px; padding-top: 10px; border-top: 1px solid #aaa; text-align: center; font-size: 9px;">Lista de Exercícios - Regras de Inferência da Lógica Proposicional</div>`;
        await html2pdf().set({ margin: 0.5, filename: "lista_inferencia_logica.pdf", image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, backgroundColor: "white" }, jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' } }).from(pdfDoc).save();
        toast.innerText = "PDF gerado!";
        setTimeout(() => toast.remove(), 2000);
    } catch(e) { toast.innerText = "Erro"; setTimeout(() => toast.remove(), 2000); }
}

function init() {
    loadStorage();
    updateStats();
    renderNavButtons();
    renderCurrentQuest();
    document.getElementById("clearAllBtn")?.addEventListener("click", clearAll);
    document.getElementById("exportPdfBtn")?.addEventListener("click", exportToPDF);
    document.getElementById("fullscreen-overlay")?.addEventListener("click", () => {
        const exp = document.querySelector(".editor-wrapper.expanded");
        if (exp) { exp.classList.remove("expanded"); document.getElementById("fullscreen-overlay")?.classList.remove("show"); document.body.style.overflow = ""; }
    });
}

window.toggleExpand = toggleExpand;
window.goToQuest = goToQuest;
init();
