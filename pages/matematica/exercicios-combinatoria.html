<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <base href="../../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Exercícios de Combinatória · SiteParaEstudar</title>
    <link rel="icon" href="Style/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #15151a;
            --card: #1c1c24;
            --border: #2a2a38;
            --accent: #fadc6d;
            --accent2: #e6b800;
            --accent3: #7c6dfa;
            --accent4: #6dfabc;
            --text: #e8e8f0;
            --muted: #7878a0;
            --correct: #2ecc71;
            --wrong: #e74c3c;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Syne', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(250,220,109,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(250,220,109,0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 70%);
        }

        .glow {
            position: fixed;
            width: 600px; height: 600px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 15s infinite alternate ease-in-out;
        }
        .glow-1 { background: var(--accent); top: -150px; left: -150px; animation-delay: 0s; }
        .glow-2 { background: var(--accent3); bottom: -150px; right: -150px; animation-delay: -5s; }
        .glow-3 { background: var(--accent4); top: 40%; left: 50%; width: 400px; height: 400px; opacity: 0.08; animation-delay: -10s; }

        @keyframes floatGlow {
            0% { transform: translate(0,0) scale(1); }
            100% { transform: translate(20px, -20px) scale(1.08); }
        }

        header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px 35px;
            border-bottom: 1px solid var(--border);
            background: radial-gradient(ellipse at 50% 0%, rgba(250,220,109,0.06), transparent 70%);
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--muted);
            text-decoration: none;
            margin-bottom: 20px;
            transition: color var(--transition);
        }
        .back-home:hover { color: var(--accent); }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--accent);
            border: 1px solid rgba(250,220,109,0.4);
            border-radius: 30px;
            padding: 5px 18px;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            background: rgba(250,220,109,0.08);
            backdrop-filter: blur(10px);
        }
        .tag::before {
            content: '';
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        header h1 {
            font-size: clamp(28px, 5vw, 44px);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent) 60%, var(--accent4) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
        }

        header p {
            color: var(--muted);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
        }

        .content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 80px;
        }

        .q-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 26px;
            margin-bottom: 20px;
            transition: all var(--transition);
            animation: cardAppear 0.45s ease both;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .q-card.answered-correct { border-color: var(--correct); box-shadow: 0 0 22px rgba(46,204,113,0.12); }
        .q-card.answered-wrong { border-color: var(--wrong); box-shadow: 0 0 22px rgba(231,76,60,0.12); }

        .q-number {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .q-text {
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 22px;
            color: var(--text);
            font-weight: 500;
        }
        .q-text .math {
            font-family: 'Space Mono', monospace;
            background: rgba(250,220,109,0.12);
            border: 1px solid rgba(250,220,109,0.25);
            border-radius: 5px;
            padding: 1px 7px;
            font-size: 13px;
            color: #fff3b8;
            font-weight: 600;
        }

        .options { display: flex; flex-direction: column; gap: 9px; margin-bottom: 20px; }

        .option {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            line-height: 1.5;
        }

        .option:hover:not(.disabled) {
            border-color: var(--accent);
            background: rgba(250,220,109,0.06);
            transform: translateX(3px);
        }

        .option.selected {
            border-color: var(--accent);
            background: rgba(250,220,109,0.12);
        }

        .option.correct-answer {
            border-color: var(--correct);
            background: rgba(46,204,113,0.1);
            color: var(--correct);
        }

        .option.wrong-answer {
            border-color: var(--wrong);
            background: rgba(231,76,60,0.1);
            color: #ff8080;
        }

        .option.disabled { cursor: default; pointer-events: none; opacity: 0.7; }

        .opt-letter {
            width: 30px; height: 30px;
            border-radius: 7px;
            background: var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            transition: all var(--transition);
        }

        .option.selected .opt-letter { background: var(--accent); color: #0d0d0f; }
        .option.correct-answer .opt-letter { background: var(--correct); color: #fff; }
        .option.wrong-answer .opt-letter { background: var(--wrong); color: #fff; }

        .feedback {
            display: none;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .feedback.show { display: block; }
        .feedback.correct { background: rgba(46,204,113,0.1); border: 1px solid rgba(46,204,113,0.3); color: var(--correct); }
        .feedback.wrong { background: rgba(231,76,60,0.1); border: 1px solid rgba(231,76,60,0.3); color: #ff8080; }
        .feedback.info { background: rgba(250,220,109,0.1); border: 1px solid rgba(250,220,109,0.3); color: #fff3b8; }

        .q-actions { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn {
            padding: 9px 20px;
            border-radius: 20px;
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary { background: var(--accent); color: #0d0d0f; box-shadow: 0 4px 10px rgba(250,220,109,0.25); }
        .btn-primary:hover { background: #ffe899; transform: translateY(-2px); }
        .btn-secondary { background: var(--border); color: var(--muted); }
        .btn-secondary:hover { background: #3a3a48; color: var(--text); }
        .btn-reveal { background: transparent; border: 1px solid var(--border); color: var(--muted); }
        .btn-reveal:hover { border-color: var(--accent4); color: var(--accent4); background: rgba(109,250,188,0.05); }

        .stats-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto 0;
            padding: 0 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .score-info {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--muted);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .score-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--surface);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .progress-wrap {
            flex: 1;
            min-width: 150px;
            max-width: 280px;
            height: 7px;
            background: var(--border);
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent4));
            border-radius: 20px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .btn-check-all {
            background: var(--accent);
            color: #0d0d0f;
            border: none;
            padding: 9px 22px;
            border-radius: 25px;
            font-family: 'Syne', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-check-all:hover { background: #ffe899; transform: translateY(-1px); }

        @media (max-width: 600px) {
            .stats-container { padding: 10px 14px; flex-direction: column; align-items: stretch; }
            .q-card { padding: 18px 14px; }
            .option { padding: 12px 14px; }
            .btn { padding: 7px 15px; font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<header>
    <a href="/pages/home/HomeMatematica.html" class="back-home">← Voltar para Home Matemática</a>
    <div class="tag">Lista de Exercícios</div>
    <h1>Contagem e Combinatória</h1>
    <p>15 exercícios em formato de múltipla escolha</p>
</header>

<div class="stats-container">
    <div class="score-info">
        <div class="score-stat">📝 <strong id="answered-count">0</strong>/<span id="total-count">15</span></div>
        <div class="score-stat" style="color:var(--correct)">✓ <strong id="correct-count">0</strong></div>
        <div class="score-stat" style="color:var(--wrong)">✗ <strong id="wrong-count">0</strong></div>
    </div>
    <div class="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
    </div>
    <button class="btn-check-all" id="checkAllBtn">📊 Ver Todas</button>
</div>

<div class="content" id="questions-container"></div>

<script>
    // ========================================
    // Dados das questões
    // ========================================
    const QUESTOES = [
        { id: "q1", text: "Uma loja de iogurte tem 5 sabores, 3 acompanhamentos e 2 coberturas. Quantas sobremesas diferentes?", correct: "C", options: { A: "10", B: "25", C: "30", D: "60" }, explanation: "5 × 3 × 2 = 30 combinações possíveis." },
        { id: "q2", text: "Um jogo tem 3 menus: 4 opções, 8 opções e 6 opções. Quantas configurações possíveis?", correct: "B", options: { A: "18", B: "192", C: "48", D: "144" }, explanation: "4 × 8 × 6 = 192 configurações." },
        { id: "q3", text: "Senha: 3 letras seguidas de 2 dígitos. Quantas senhas diferentes? (26 letras, 10 dígitos)", correct: "A", options: { A: "26³ × 10² = 1.757.600", B: "26 × 25 × 24 × 10 × 9 = 1.404.000", C: "36⁵ = 60.466.176", D: "26³ + 10² = 17.676" }, explanation: "26³ × 10² = 17.576 × 100 = 1.757.600." },
        { id: "q4", text: "175 apartamentos, código de 2 algarismos. Compra inteligente? (0-9, 2 dígitos)", correct: "B", options: { A: "Sim, 100 códigos são suficientes", B: "Não, 100 códigos são insuficientes", C: "Sim, 10² = 100 códigos", D: "Não, 90 códigos são insuficientes" }, explanation: "10 × 10 = 100 códigos, mas são 175 apartamentos. Compra NÃO inteligente." },
        { id: "q5", text: "Números de 3 dígitos < 600 usando {8,6,4,2} sem repetição. Quantos?", correct: "B", options: { A: "12", B: "6", C: "18", D: "9" }, explanation: "Primeiro dígito deve ser 2 ou 4. Total: 6." },
        { id: "q6", text: "Quantas permutações da palavra ERRO?", correct: "B", options: { A: "24", B: "12", C: "6", D: "4" }, explanation: "4! / 2! = 12." },
        { id: "q7", text: "1º, 2º e 3º prêmios em competição com 15 participantes. Quantas maneiras?", correct: "B", options: { A: "C(15,3) = 455", B: "P(15,3) = 2.730", C: "15³ = 3.375", D: "15!" }, explanation: "15 × 14 × 13 = 2.730." },
        { id: "q8", text: "Time titular: 11 jogadores escolhidos entre 18. Quantas maneiras?", correct: "B", options: { A: "P(18,11)", B: "C(18,11) = 31.824", C: "18¹¹", D: "11!" }, explanation: "C(18,11) = 31.824." },
        { id: "q9", text: "Júri: 5 homens (de 17) e 7 mulheres (de 23). Quantas maneiras?", correct: "A", options: { A: "C(17,5) × C(23,7)", B: "C(40,12)", C: "C(17,5) + C(23,7)", D: "P(17,5) × P(23,7)" }, explanation: "Multiplica as combinações." },
        { id: "q10", text: "42 turistas, 35 falam inglês, 18 falam francês. Quantos falam os dois?", correct: "B", options: { A: "7", B: "11", C: "17", D: "53" }, explanation: "35 + 18 - 42 = 11." },
        { id: "q11", text: "Convidados: 13 café, 10 chá, 4 ambos. Quantas pessoas?", correct: "C", options: { A: "27", B: "23", C: "19", D: "15" }, explanation: "13 + 10 - 4 = 19." },
        { id: "q12", text: "Produtos: 12 hálito, 10 gengivite, 11 placas. 6 (hálito+placas), 5 (gengivite+hálito), 5 (gengivite+placas). Total 19. Quantos têm as 3?", correct: "A", options: { A: "2", B: "3", C: "4", D: "5" }, explanation: "19 = 12+10+11-6-5-5+x → x = 2." },
        { id: "q13", text: "50 homens, 50 mulheres. Quantos nomes para garantir um de cada sexo?", correct: "A", options: { A: "51", B: "50", C: "2", D: "100" }, explanation: "Pior caso: 50 do mesmo sexo. O 51º é do outro." },
        { id: "q14", text: "Quantas pessoas para garantir 2 no mesmo mês?", correct: "B", options: { A: "12", B: "13", C: "24", D: "2" }, explanation: "12 meses → 13 pessoas garantem 2 no mesmo mês." },
        { id: "q15", text: "Quantas cartas para garantir 2 do mesmo naipe? (52 cartas, 4 naipes)", correct: "B", options: { A: "4", B: "5", C: "13", D: "14" }, explanation: "4 naipes. Pior caso: 1 de cada = 4. A 5ª repete." }
    ];

    // Estado
    let userAnswers = {};
    let questionStatus = {};

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        if (!container) return;
        
        let html = '';
        QUESTOES.forEach((q, idx) => {
            const savedAnswer = userAnswers[q.id] || '';
            const status = questionStatus[q.id];
            const cardClass = status === 'correct' ? 'answered-correct' : (status === 'wrong' ? 'answered-wrong' : '');
            
            html += `
                <div class="q-card ${cardClass}" id="card-${q.id}">
                    <div class="q-number">Questão ${idx + 1}</div>
                    <div class="q-text">${q.text}</div>
                    <div class="options" id="opts-${q.id}">
                        ${Object.entries(q.options).map(([letter, text]) => `
                            <div class="option ${savedAnswer === letter ? 'selected' : ''}" data-qid="${q.id}" data-opt="${letter}">
                                <span class="opt-letter">${letter}</span> ${text}
                            </div>
                        `).join('')}
                    </div>
                    <div class="feedback" id="fb-${q.id}"></div>
                    <div class="q-actions">
                        <button class="btn btn-primary" onclick="checkQuestion('${q.id}')">✓ Verificar</button>
                        <button class="btn btn-reveal" onclick="revealAnswer('${q.id}')">📖 Gabarito</button>
                        <button class="btn btn-secondary" onclick="resetQuestion('${q.id}')">↺ Limpar</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
        
        document.querySelectorAll('.option').forEach(opt => {
            opt.removeEventListener('click', handleOptionClick);
            opt.addEventListener('click', handleOptionClick);
        });
    }

    function handleOptionClick(e) {
        const opt = e.currentTarget;
        const qid = opt.dataset.qid;
        const val = opt.dataset.opt;
        if (!qid || !val) return;
        if (questionStatus[qid]) return;
        
        userAnswers[qid] = val;
        delete questionStatus[qid];
        
        const container = document.getElementById(`opts-${qid}`);
        if (container) {
            container.querySelectorAll('.option').forEach(optDiv => {
                optDiv.classList.remove('selected');
                if (optDiv.dataset.opt === val) optDiv.classList.add('selected');
            });
        }
        
        const fb = document.getElementById(`fb-${qid}`);
        if (fb) fb.classList.remove('show');
        
        const card = document.getElementById(`card-${qid}`);
        if (card) card.classList.remove('answered-correct', 'answered-wrong');
        
        updateStats();
    }

    window.checkQuestion = function(qid) {
        const q = QUESTOES.find(qq => qq.id === qid);
        const userAnswer = userAnswers[qid];
        
        if (!userAnswer) {
            const fb = document.getElementById(`fb-${qid}`);
            if (fb) {
                fb.className = 'feedback info show';
                fb.innerHTML = '⚠️ Selecione uma alternativa antes de verificar.';
            }
            return;
        }
        
        const isCorrect = (userAnswer === q.correct);
        questionStatus[qid] = isCorrect ? 'correct' : 'wrong';
        
        const container = document.getElementById(`opts-${qid}`);
        if (container) {
            container.querySelectorAll('.option').forEach(optDiv => {
                optDiv.classList.remove('correct-answer', 'wrong-answer');
                if (optDiv.dataset.opt === q.correct) {
                    optDiv.classList.add('correct-answer');
                }
                if (optDiv.dataset.opt === userAnswer && !isCorrect) {
                    optDiv.classList.add('wrong-answer');
                }
            });
        }
        
        const fb = document.getElementById(`fb-${qid}`);
        if (fb) {
            if (isCorrect) {
                fb.className = 'feedback correct show';
                fb.innerHTML = `<strong>✓ Correto!</strong> ${q.explanation}`;
            } else {
                fb.className = 'feedback wrong show';
                fb.innerHTML = `<strong>✗ Incorreto.</strong> A resposta correta é ${q.correct}.<br>${q.explanation}`;
            }
        }
        
        const card = document.getElementById(`card-${qid}`);
        if (card) {
            card.classList.remove('answered-correct', 'answered-wrong');
            card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');
        }
        
        updateStats();
    };

    window.revealAnswer = function(qid) {
        const q = QUESTOES.find(qq => qq.id === qid);
        const fb = document.getElementById(`fb-${qid}`);
        if (fb) {
            fb.className = 'feedback info show';
            fb.innerHTML = `<strong>📖 Gabarito:</strong> Alternativa ${q.correct}<br>${q.explanation}`;
        }
    };

    window.resetQuestion = function(qid) {
        delete userAnswers[qid];
        delete questionStatus[qid];
        
        const container = document.getElementById(`opts-${qid}`);
        if (container) {
            container.querySelectorAll('.option').forEach(optDiv => {
                optDiv.classList.remove('selected', 'correct-answer', 'wrong-answer');
            });
        }
        const fb = document.getElementById(`fb-${qid}`);
        if (fb) fb.classList.remove('show');
        const card = document.getElementById(`card-${qid}`);
        if (card) card.classList.remove('answered-correct', 'answered-wrong');
        
        updateStats();
    };

    function updateStats() {
        const total = QUESTOES.length;
        const answered = Object.keys(userAnswers).length;
        const correct = Object.values(questionStatus).filter(s => s === 'correct').length;
        const wrong = Object.values(questionStatus).filter(s => s === 'wrong').length;
        
        document.getElementById('answered-count').textContent = answered;
        document.getElementById('correct-count').textContent = correct;
        document.getElementById('wrong-count').textContent = wrong;
        document.getElementById('total-count').textContent = total;
        
        const progress = (correct / total) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
    }

    window.checkAll = function() {
        const answered = Object.keys(userAnswers).length;
        const correct = Object.values(questionStatus).filter(s => s === 'correct').length;
        const total = QUESTOES.length;
        
        if (answered === total && correct === total) {
            alert('🎉 Parabéns! Todas as questões estão corretas!');
        } else {
            alert(`📊 Progresso: ${answered}/${total} respondidas\n✓ ${correct} corretas\n✗ ${answered - correct} incorretas`);
        }
    };

    // Inicialização
    renderQuestions();
    updateStats();
    document.getElementById('checkAllBtn')?.addEventListener('click', checkAll);
    
    // Expor funções globalmente
    window.checkQuestion = checkQuestion;
    window.revealAnswer = revealAnswer;
    window.resetQuestion = resetQuestion;
    window.checkAll = checkAll;
</script>
<script src="JS/footer.js"></script>

</body>
</html>
